<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Image Gallery</title>
    <style>
        body {
            background: linear-gradient(to bottom, #000000, #00008B);
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh; 
            margin: 0;
            padding: 0; /* Changed to 0 so Nav spans full width */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.8s ease-in-out;
        }

        /* --- Navigation Bar --- */
        nav {
            background-color: rgba(0, 0, 0, 0.7); /* Transparent black */
            padding: 15px 0;
            text-align: center;
            position: sticky; /* Stays at the top when you scroll */
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #00d4ff; /* Glow color on hover */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        /* --- Grid Layout --- */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px; 
            margin: 40px auto; /* Margin top to separate from Nav */
            padding: 20px;
        }

        .image-gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            
            /* The 7px Black Border you asked for */
            border: 7px solid #000000;
            box-sizing: border-box; /* Ensures the border doesn't make the image overflow */
            
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .image-gallery img:hover {
            transform: scale(1.02);
            border-color: #ffffff; /* Border turns white on hover */
        }

        /* --- Fullscreen Overlay --- */
        #img-overlay {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        #full-img {
            max-width: 90%;
            max-height: 80%;
            border: 5px solid white;
        }

        #close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    </div>

    <script>
        const overlay = document.getElementById('img-overlay');
        const fullImg = document.getElementById('full-img');
        const closeBtn = document.getElementById('close-btn');

        const rainbowGradients = [
            "linear-gradient(to bottom, #000000, #ff0000)", 
            "linear-gradient(to bottom, #000000, #ff7f00)", 
            "linear-gradient(to bottom, #000000, #ffff00)", 
            "linear-gradient(to bottom, #000000, #00ff00)", 
            "linear-gradient(to bottom, #000000, #0000ff)", 
            "linear-gradient(to bottom, #000000, #4b0082)", 
            "linear-gradient(to bottom, #000000, #9400d3)"  
        ];
        
        let currentColorIndex = 4;

        function openFull(source) {
            overlay.style.display = "flex";
            fullImg.src = source;
            document.body.style.background = "url('" + source + "') no-repeat center center / cover fixed";
        }

        closeBtn.onclick = function() { overlay.style.display = "none"; }
        overlay.onclick = function(event) { if (event.target !== fullImg) overlay.style.display = "none"; }

        window.addEventListener('keydown', function(event) {
            if (event.key.toLowerCase() === "w") {
                currentColorIndex = (currentColorIndex + 1) % rainbowGradients.length;
                document.body.style.background = rainbowGradients[currentColorIndex] + " no-repeat center center / cover fixed";
            }

            if (event.code === "Space") {
                event.preventDefault(); 
                currentColorIndex = 4;
                document.body.style.background = "linear-gradient(to bottom, #000000, #00008B) no-repeat center center / cover fixed";
            }
            
            if (event.key === "Escape") {
                overlay.style.display = "none";
            }
        });
    </script>
