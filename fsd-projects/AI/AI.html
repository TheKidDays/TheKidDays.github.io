<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Dice - Smart Targeting</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --hero-top: #ffd700; --hero-bottom: #2ecc71; --enemy: #ff4d4d; --gold: #ffd700; --hp-green: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; overflow: hidden; min-height: 100vh; }
        
        .stage { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px; margin-top: 40px; margin-bottom: 20px; padding: 0 50px; }
        .party { display: flex; flex-direction: column; gap: 40px; }
        
        .unit { padding: 25px; background: var(--panel); border-radius: 16px; text-align: center; width: 170px; border: 2px solid transparent; position: relative; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Conditional Targeting Visuals */
        .can-target { cursor: pointer; border: 2px dashed white !important; transform: scale(1.1); background: #333; z-index: 5; }
        
        .targeted-by-enemy { border: 4px solid var(--enemy) !important; box-shadow: 0 0 20px rgba(255, 77, 77, 0.4); }
        .target-marker { position: absolute; left: -50px; top: 50%; transform: translateY(-50%); font-size: 2rem; }

        .hero-top { border-color: var(--hero-top); }
        .hero-bottom { border-color: var(--hero-bottom); }
        .unit.enemy { border-color: var(--enemy); transform: scale(1.4); } 
        .unit.enemy.can-target { transform: scale(1.5); }
        
        .hp-container { width: 100%; height: 12px; background: #333; border-radius: 6px; margin: 12px 0; overflow: hidden; }
        .hp-fill { height: 100%; background: var(--hp-green); transition: width 0.3s ease; }
        .hp-text { font-size: 1.8rem; font-weight: bold; }
        .armor-text { color: var(--gold); font-weight: bold; font-size: 0.9rem; height: 1.2rem; }

        .dice-area { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; }
        .dice-tray { display: flex; gap: 20px; min-height: 100px; padding: 25px; background: rgba(0,0,0,0.4); border-radius: 20px; }

        .die { width: 75px; height: 75px; background: #333; border: 3px solid #666; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; position: relative; }
        .die.hero0-die { border-color: var(--hero-top); color: var(--hero-top); }
        .die.hero1-die { border-color: var(--hero-bottom); color: var(--hero-bottom); }
        .die.locked { border-color: white; transform: translateY(-10px); }
        .die.selected { border-color: #00ccff; box-shadow: 0 0 20px #00ccff; transform: translateY(-20px); z-index: 10; }
        .die.assigned { opacity: 0.4; transform: scale(0.9); }

        .controls { margin-top: 25px; display: flex; gap: 15px; }
        button { padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #444; color: white; font-size: 1rem; }
        #roll-btn { background: #4da6ff; }
        #exec-btn { background: #28a745; }

        .floating-text { position: absolute; font-weight: bold; font-size: 1.5rem; animation: floatUp 1s forwards; pointer-events: none; width: 100%; text-align: center; left: 0; z-index: 20; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <div class="stage">
        <div class="party">
            <div class="unit hero hero-top" id="hero0-unit" onclick="assignToTarget('hero0')">
                <div id="hero0-marker"></div>
                <div style="font-size: 0.8rem; color: #888;">Hero 1 (Archer)</div>
                <div class="hp-text" id="hero0-hp">20</div>
                <div class="hp-container"><div id="hero0-hp-bar" class="hp-fill"></div></div>
                <div class="armor-text" id="hero0-armor-display"></div>
            </div>
            <div class="unit hero hero-bottom" id="hero1-unit" onclick="assignToTarget('hero1')">
                <div id="hero1-marker"></div>
                <div style="font-size: 0.8rem; color: #888;">Hero 2 (Warrior)</div>
                <div class="hp-text" id="hero1-hp">20</div>
                <div class="hp-container"><div id="hero1-hp-bar" class="hp-fill"></div></div>
                <div class="armor-text" id="hero1-armor-display"></div>
            </div>
        </div>

        <div class="unit enemy" id="enemy-unit" onclick="assignToTarget('enemy')">
            <div style="font-weight: bold;">Slime</div>
            <div class="hp-text" id="enemy-hp">20</div>
            <div class="hp-container"><div id="enemy-hp-bar" class="hp-fill"></div></div>
            <div id="enemy-intent" style="color: #ffbaba; font-size: 1rem; font-weight: bold;">⚔️ 5</div>
        </div>
    </div>

    <div class="dice-area">
        <div class="dice-tray" id="tray"></div>
        <div class="controls">
            <button id="roll-btn" onclick="handleRoll()">Roll Dice (3 left)</button>
            <button id="exec-btn" onclick="finalizeActions()" style="display:none">EXECUTE TURN</button>
            <button id="end-turn-btn" onclick="enemyTurn()" disabled>End Turn</button>
        </div>
        <div id="msg" style="margin-top:20px; color:var(--gold);">Select a die to see valid targets.</div>
    </div>

    <script>
        const YELLOW_SIDES = [
            { label: "🏹 4", type: 'Attack', val: 5 },
            { label: "🛡️ 4", type: 'Defense', val: 4 },
            { label: "🛡️ 3", type: 'Defense', val: 3 },
            { label: "✨ 3", type: 'Healing', val: 3 },
            { label: "✨ 4", type: 'Healing', val: 4 },
            { label: "❌", type: 'null', val: 0 }
        ];

        const GREEN_SIDES = [
            { label: "⚔️ 3", type: 'Attack', val: 6 },
            { label: "⚔️ 3", type: 'Attack', val: 6 },
            { label: "⚔️ 2", type: 'Attack', val: 4 },
            { label: "🛡️ 1", type: 'Defense', val: 4 },
            { label: "🛡️ 1", type: 'Defense', val: 2 },
            { label: "❌", type: 'null', val: 0 }
        ];

        let state = {
            heroes: [{ hp: 20, maxHp: 20, armor: 0 }, { hp: 20, maxHp: 20, armor: 0 }],
            enemyHP: 20, maxEnemyHP: 20, enemyAtk: 5, enemyTargetIdx: 0,
            rolls: 3, turnDone: false,
            dice: [
                { side: null, locked: false, owner: 0, target: null },
                { side: null, locked: false, owner: 0, target: null },
                { side: null, locked: false, owner: 1, target: null },
                { side: null, locked: false, owner: 1, target: null }
            ],
            selectedIdx: null
        };

        function setEnemyIntent() {
            state.enemyTargetIdx = Math.floor(Math.random() * 2);
            state.enemyAtk = Math.floor(Math.random() * 4) + 4;
        }
        setEnemyIntent();

        function handleRoll() {
            if (state.rolls <= 0 || state.turnDone) return;
            state.dice.forEach(d => {
                if (!d.locked) { 
                    const pool = (d.owner === 0) ? YELLOW_SIDES : GREEN_SIDES;
                    d.side = pool[Math.floor(Math.random() * pool.length)]; 
                    d.target = null; 
                }
            });
            state.rolls--;
            updateUI();
        }

        function handleDieClick(i) {
            if (state.turnDone) return;
            if (state.rolls > 0) {
                state.dice[i].locked = !state.dice[i].locked;
            } else if (state.dice[i].side && state.dice[i].side.val > 0) {
                state.selectedIdx = (state.selectedIdx === i) ? null : i;
            }
            updateUI();
        }

        function assignToTarget(targetId) {
            if (state.selectedIdx === null) return;
            const die = state.dice[state.selectedIdx];
            
            // Validation: Attack dice can ONLY hit enemy. Support dice can ONLY hit heroes.
            if (die.side.type === 'Attack' && targetId !== 'enemy') return;
            if ((die.side.type === 'Defense' || die.side.type === 'Healing') && targetId === 'enemy') return;

            die.target = targetId;
            state.selectedIdx = null;
            updateUI();
        }

        function finalizeActions() {
            state.turnDone = true;
            state.dice.forEach(d => {
                if (!d.side || !d.target || d.side.val === 0) return;
                if (d.target === 'enemy') {
                    state.enemyHP -= d.side.val;
                    spawnFloatingText(`-${d.side.val}`, '#ff4d4d', 'enemy-unit');
                } else {
                    let idx = parseInt(d.target.replace('hero', ''));
                    if (d.side.type === 'Defense') state.heroes[idx].armor += d.side.val;
                    if (d.side.type === 'Healing') {
                        let old = state.heroes[idx].hp;
                        state.heroes[idx].hp = Math.min(state.heroes[idx].maxHp, state.heroes[idx].hp + d.side.val);
                        spawnFloatingText(`+${state.heroes[idx].hp - old}`, '#2ecc71', `hero${idx}-unit`);
                    }
                }
            });
            updateUI();
            if (state.enemyHP <= 0) { alert("Victory!"); location.reload(); }
        }

        function enemyTurn() {
            const target = state.enemyTargetIdx;
            const dmg = Math.max(0, state.enemyAtk - state.heroes[target].armor);
            state.heroes[target].hp -= dmg;
            state.heroes.forEach(h => h.armor = 0);
            if (dmg > 0) {
                spawnFloatingText(`-${dmg}`, '#ff4d4d', `hero${target}-unit`);
                document.getElementById(`hero${target}-unit`).classList.add('shake');
            }
            state.rolls = 3; state.turnDone = false;
            state.dice.forEach(d => { d.locked = false; d.side = null; d.target = null; });
            setEnemyIntent();
            updateUI();
            if (state.heroes[0].hp <= 0 && state.heroes[1].hp <= 0) { alert("Defeat!"); location.reload(); }
        }

        function updateUI() {
            const selectedDie = state.selectedIdx !== null ? state.dice[state.selectedIdx] : null;

            state.heroes.forEach((h, i) => {
                const el = document.getElementById(`hero${i}-unit`);
                const marker = document.getElementById(`hero${i}-marker`);
                document.getElementById(`hero${i}-hp`).innerText = Math.max(0, h.hp);
                document.getElementById(`hero${i}-hp-bar`).style.width = (h.hp / h.maxHp * 100) + '%';
                document.getElementById(`hero${i}-armor-display`).innerText = h.armor > 0 ? `🛡️ Armor: ${h.armor}` : "";
                
                // Hero only highlights if support die is selected
                let canBeTargeted = selectedDie && (selectedDie.side.type === 'Defense' || selectedDie.side.type === 'Healing');
                el.className = `unit hero ${i===0?'hero-top':'hero-bottom'} ${canBeTargeted?'can-target':''}`;
                
                if (state.enemyTargetIdx === i) {
                    el.classList.add('targeted-by-enemy');
                    marker.innerHTML = '<div class="target-marker">🎯</div>';
                } else marker.innerHTML = '';
            });

            // Enemy only highlights if attack die is selected
            const enemyEl = document.getElementById('enemy-unit');
            const enemyCanTarget = selectedDie && selectedDie.side.type === 'Attack';
            enemyEl.className = `unit enemy ${enemyCanTarget?'can-target':''}`;
            document.getElementById('enemy-hp').innerText = Math.max(0, state.enemyHP);
            document.getElementById('enemy-hp-bar').style.width = (state.enemyHP / state.maxEnemyHP * 100) + '%';
            document.getElementById('enemy-intent').innerText = `⚔️ ${state.enemyAtk}`;
            
            const tray = document.getElementById('tray'); tray.innerHTML = '';
            state.dice.forEach((d, i) => {
                const el = document.createElement('div');
                el.className = `die hero${d.owner}-die ${d.locked?'locked':''} ${i===state.selectedIdx?'selected':''} ${d.target?'assigned':''}`;
                el.innerHTML = d.side ? d.side.label : '?';
                el.onclick = () => handleDieClick(i);
                tray.appendChild(el);
            });

            let allAssigned = state.dice.every(d => !d.side || d.side.val === 0 || d.target !== null);
            document.getElementById('exec-btn').style.display = (state.rolls === 0 && allAssigned && !state.turnDone) ? 'block' : 'none';
            document.getElementById('roll-btn').innerText = `Roll (${state.rolls})`;
            document.getElementById('roll-btn').style.visibility = (state.rolls > 0 && !state.turnDone) ? 'visible' : 'hidden';
            document.getElementById('end-turn-btn').disabled = !state.turnDone;
        }

        function spawnFloatingText(v, c, id) {
            const el = document.getElementById(id);
            const t = document.createElement('div');
            t.className = 'floating-text'; t.innerText = v; t.style.color = c;
            el.appendChild(t); setTimeout(() => t.remove(), 1000);
        }

        updateUI();
    </script>
</body>
</html>
